name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release assets are the programs themselves. The 64-bit ones keep
          # their plain names; running copies look for these when updating.
          - target: x86_64-pc-windows-msvc
            app: equinox.exe
            cli: eqx.exe
          - target: i686-pc-windows-msvc
            app: equinox-x86.exe
            cli: eqx-x86.exe
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Test
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$dir/equinox.exe" "dist/${{ matrix.app }}"
          Copy-Item "$dir/eqx.exe" "dist/${{ matrix.cli }}"

      - uses: actions/upload-artifact@v6
        with:
          name: equinox-${{ matrix.target }}
          path: dist/*.exe

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.app }}" "dist/${{ matrix.cli }}" --clobber
